version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nids_postgres
    environment:
      POSTGRES_USER: nids_user
      POSTGRES_PASSWORD: nids_pass
      POSTGRES_DB: nids_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nids_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nids_backend
    environment:
      DATABASE_URL: postgresql://nids_user:nids_pass@postgres:5432/nids_db
      DEBUG: "False"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./models:/app/models
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nids_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8000

volumes:
  postgres_data:
